header:
    version: 18

distro: helios9-distro
target: helios9-image-minimal

repos:
    poky:
        url: https://git.yoctoproject.org/git/poky
        branch: scarthgap
        layers:
            meta:
            meta-poky:
            meta-yocto-bsp:

    meta-openembedded:
        url: https://git.openembedded.org/meta-openembedded
        branch: scarthgap
        layers:
            meta-networking:
            meta-python:
            meta-oe:

    meta-helios9:
        path: ../../

local_conf_header:
    debug: |-
        EXTRA_IMAGE_FEATURES += "debug-tweaks"
    history: |-
        INHERIT += "buildhistory"
    journal: |-
        VOLATILE_LOG_DIR = "no"
    local_dirs: |-
        DL_DIR = "/home/kas/yocto/.dl"
        SSTATE_DIR = "/home/kas/yocto.sstate-cache"
    sstate-mirrors: |-
        SSTATE_MIRRORS = "file://.* http://yoctoproject.org"
    systemd: |-
        ROOT_HOME = "/root"
